name: 功能建议
description: 提议一个适合新手复盘流程的改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么复盘流程中遇到了什么不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 理想操作流程是什么？尽量描述用户动作和结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可接受的简化方案
      description: 如果完整方案较重，哪种更小的改动也能解决问题？
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 这个建议与基础对局、截图复盘、实时识别或 AI 推演直接相关。
          required: true
        - label: 如包含第三方素材或项目，我会附来源和许可证。
          required: true
