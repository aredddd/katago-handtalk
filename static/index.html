<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KataGo Web</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚫</text></svg>">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header id="header">
            <h1>KataGo Web</h1>
            <div id="status-indicator">
                <span id="engine-status" class="status-dot offline"></span>
                <span id="engine-text">…</span>
            </div>
            <div id="header-right">
                <button id="btn-lang" class="btn-lang" title="Switch language">中/EN</button>
                <div id="auth-area">
                    <button id="btn-show-login" class="btn-auth">Sign in</button>
                </div>
            </div>
        </header>

        <!-- Main content -->
        <main id="main-content">
            <!-- Left: board + navigation -->
            <div id="board-area">
                <div id="board-container">
                    <canvas id="goboard"></canvas>
                </div>

                <div id="move-nav">
                    <div id="nav-buttons">
                        <button id="nav-start">⏮</button>
                        <button id="nav-back10">⏪</button>
                        <button id="nav-back1">◀</button>
                        <button id="nav-forward1">▶</button>
                        <button id="nav-forward10">⏩</button>
                        <button id="nav-end">⏭</button>
                    </div>
                    <div id="nav-slider-row">
                        <span id="nav-move-num">0</span>
                        <input type="range" id="nav-slider" min="0" max="0" value="0" step="1">
                        <span id="nav-move-total">/ 0</span>
                    </div>
                </div>

                <!-- Winrate strip -->
                <div id="winrate-strip">
                    <span id="wr-black-label" class="wr-label">⚫ <span id="winrate-black">50.0%</span></span>
                    <div id="winrate-bar-container">
                        <div id="winrate-bar-black"></div>
                    </div>
                    <span id="wr-white-label" class="wr-label"><span id="winrate-white">50.0%</span> ⚪</span>
                    <span id="score-lead" class="score-lead-inline">0.0</span>
                </div>
            </div>

            <!-- Right: control panel -->
            <div id="panel">
                <div class="panel-section">
                    <div class="mode-buttons">
                        <button class="mode-btn active" data-mode="free-play">♟ <span class="i18n" data-key="freePlay">Free play</span></button>
                        <button class="mode-btn" data-mode="play-black">⚫ <span class="i18n" data-key="playBlack">Play black</span></button>
                        <button class="mode-btn" data-mode="play-white">⚪ <span class="i18n" data-key="playWhite">Play white</span></button>
                        <button class="mode-btn" data-mode="ai-vs-ai">🤖 <span class="i18n" data-key="aiVsAi">AI vs AI</span></button>
                    </div>
                    <div class="action-buttons" style="margin-top:8px">
                        <button id="btn-undo">↩ <span class="i18n" data-key="undo">Undo</span></button>
                        <button id="btn-pass">⏭ <span class="i18n" data-key="pass">Pass</span></button>
                        <button id="btn-analyze">🔍 <span class="i18n" data-key="analyze">Analyze</span></button>
                        <button id="btn-new-game">🔄 <span class="i18n" data-key="newGame">New game</span></button>
                    </div>
                    <div class="action-buttons" style="margin-top:4px">
                        <button id="btn-camera">📷 <span class="i18n" data-key="recognize">Photo</span></button>
                        <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none">
                    </div>
                </div>

                <!-- Settings -->
                <div class="panel-section collapsible" id="settings-section">
                    <h3 class="section-toggle" data-target="settings-body">
                        ⚙ <span class="i18n" data-key="settings">Settings</span>
                        <span class="toggle-icon">▾</span>
                    </h3>
                    <div id="settings-body" class="section-body">
                        <div class="setting-row">
                            <label for="board-size"><span class="i18n" data-key="boardSize">Board</span></label>
                            <select id="board-size">
                                <option value="19" selected>19×19</option>
                                <option value="13">13×13</option>
                                <option value="9">9×9</option>
                            </select>
                        </div>
                        <div class="setting-row">
                            <label for="komi"><span class="i18n" data-key="komi">Komi</span></label>
                            <select id="komi">
                                <option value="7.5" selected>7.5</option>
                                <option value="6.5">6.5</option>
                                <option value="0.5">0.5</option>
                                <option value="0">0</option>
                            </select>
                        </div>
                        <div class="setting-row">
                            <label for="max-visits"><span class="i18n" data-key="visits">Visits</span></label>
                            <select id="max-visits">
                                <option value="100">100</option>
                                <option value="300">300</option>
                                <option value="500">500</option>
                                <option value="1000">1000</option>
                                <option value="3000" selected>3000</option>
                                <option value="10000">10000</option>
                            </select>
                        </div>
                        <div class="setting-row">
                            <label><input type="checkbox" id="show-analysis" checked> <span class="i18n" data-key="showAnalysis">Analysis</span></label>
                            <label><input type="checkbox" id="show-ownership"> <span class="i18n" data-key="showOwnership">Ownership</span></label>
                            <label><input type="checkbox" id="show-move-number"> <span class="i18n" data-key="showMoveNum">Move #</span></label>
                        </div>
                    </div>
                </div>

                <!-- Suggestions -->
                <div class="panel-section" id="suggestions-section">
                    <h3><span class="i18n" data-key="suggestions">Suggestions</span></h3>
                    <div id="suggestions-list">
                        <p class="placeholder i18n" data-key="suggestPlaceholder">Analysis shown after a move</p>
                    </div>
                </div>

                <!-- PV -->
                <div class="panel-section" id="pv-section">
                    <h3><span class="i18n" data-key="mainLine">Main line</span></h3>
                    <div id="pv-display">
                        <p class="placeholder i18n" data-key="pvPlaceholder">Click a suggestion to view the line</p>
                    </div>
                </div>
            </div>
        </main>

        <!-- Board recognition modal -->
        <div id="recognize-modal" class="modal-overlay" style="display:none">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>📷 <span class="i18n" data-key="recognize">Photo</span></h3>
                    <button id="modal-close" class="modal-close-btn">✕</button>
                </div>
                <div class="modal-body">
                    <div id="recognize-loading" style="display:none">
                        <p><span class="i18n" data-key="recognizing">🤖 Recognising board, please wait…</span></p>
                    </div>
                    <div id="recognize-result" style="display:none">
                        <div class="recognize-preview-row">
                            <div class="recognize-preview-col">
                                <p class="preview-label"><span class="i18n" data-key="recognizeResult">Recognition result</span></p>
                                <canvas id="recognize-board-canvas" width="380" height="380"></canvas>
                            </div>
                        </div>
                        <div id="recognize-info">
                            <span id="recognize-confidence"></span>
                            <span id="recognize-auto-status"></span>
                        </div>
                        <p class="recognize-hint"><span class="i18n" data-key="recognizeHint">Click to correct: empty → ⚫ → ⚪ → empty</span></p>
                        <div class="recognize-actions">
                            <button id="btn-recognize-confirm" class="btn-primary">✅ <span class="i18n" data-key="confirmLoad">Load board</span></button>
                            <button id="btn-recognize-retry">📷 <span class="i18n" data-key="retakePhoto">Retake photo</span></button>
                            <div class="recognize-color-select">
                                <label><span class="i18n" data-key="nextPlayer">Next to play:</span></label>
                                <select id="recognize-next-player">
                                    <option value="1">⚫ <span class="i18n" data-key="black">B</span></option>
                                    <option value="2">⚪ <span class="i18n" data-key="white">W</span></option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Auth modal (login / register) -->
        <div id="auth-modal" class="modal-overlay" style="display:none">
            <div class="modal-content auth-modal-content">
                <div class="modal-header">
                    <div class="auth-tabs">
                        <button class="auth-tab active" id="tab-login">
                            <span class="i18n" data-key="signIn">Sign in</span>
                        </button>
                        <button class="auth-tab" id="tab-register">
                            <span class="i18n" data-key="register">Register</span>
                        </button>
                    </div>
                    <button id="auth-modal-close" class="modal-close-btn">✕</button>
                </div>
                <div class="modal-body">
                    <div id="auth-error" class="auth-error" style="display:none"></div>
                    <form id="auth-form" class="auth-form" autocomplete="on">
                        <label for="auth-username-input" class="i18n" data-key="username">Username</label>
                        <input type="text" id="auth-username-input" autocomplete="username">
                        <label for="auth-password-input" class="i18n" data-key="password">Password</label>
                        <input type="password" id="auth-password-input" autocomplete="current-password">
                        <button type="submit" id="auth-submit" class="btn-primary i18n" data-key="signIn">Sign in</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Socket.IO -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
    <!-- Go Board -->
    <script src="js/goboard.js"></script>
    <!-- App Logic -->
    <script src="js/app.js"></script>
</body>
</html>
