<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KataGo Web — Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div id="app">
        <header id="header">
            <h1>KataGo Web <span class="admin-badge">Admin</span></h1>
            <div id="header-right">
                <span id="admin-username" class="auth-username"></span>
                <a href="/" class="btn-auth">← Main app</a>
                <button id="btn-logout" class="btn-auth btn-auth-out">Sign out</button>
            </div>
        </header>

        <main id="admin-main">

            <!-- Users section -->
            <section class="admin-section">
                <div class="admin-section-header">
                    <h2>Users</h2>
                    <span id="user-count" class="badge"></span>
                </div>
                <table id="user-table" class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Role</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="user-tbody">
                        <tr><td colspan="4" class="loading-cell">Loading…</td></tr>
                    </tbody>
                </table>
            </section>

            <!-- Settings section -->
            <section class="admin-section">
                <h2>Settings</h2>
                <div class="admin-setting-row">
                    <div>
                        <div class="setting-label">Open registration</div>
                        <div class="setting-desc">Allow new users to create accounts</div>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="toggle-registration" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </section>

            <!-- Change password section -->
            <section class="admin-section">
                <h2>Change admin password</h2>
                <form id="change-pw-form" class="admin-form">
                    <div class="form-row">
                        <label for="old-password">Current password</label>
                        <input type="password" id="old-password" autocomplete="current-password">
                    </div>
                    <div class="form-row">
                        <label for="new-password">New password</label>
                        <input type="password" id="new-password" autocomplete="new-password">
                    </div>
                    <div class="form-row">
                        <label for="confirm-password">Confirm new password</label>
                        <input type="password" id="confirm-password" autocomplete="new-password">
                    </div>
                    <div id="pw-message" class="form-message" style="display:none"></div>
                    <button type="submit" class="btn-primary">Update password</button>
                </form>
            </section>

        </main>
    </div>

    <!-- Auth gate modal (shown if not logged in as admin) -->
    <div id="admin-auth-gate" class="modal-overlay" style="display:none">
        <div class="modal-content auth-modal-content">
            <div class="modal-header">
                <h3>Admin sign in</h3>
            </div>
            <div class="modal-body">
                <div id="gate-error" class="auth-error" style="display:none"></div>
                <form id="gate-form" class="auth-form">
                    <label for="gate-username">Username</label>
                    <input type="text" id="gate-username" value="admin" autocomplete="username">
                    <label for="gate-password">Password</label>
                    <input type="password" id="gate-password" autocomplete="current-password">
                    <button type="submit" class="btn-primary">Sign in</button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
