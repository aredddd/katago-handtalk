# KataGo HandTalk - conservative cross-hardware analysis profile
# Used with: katago analysis -model <network> -config <this file>

logDir = katago_analysis_logs
logToStderr = false
logSearchInfo = false

# The frontend normalizes all values to Black's perspective.
reportAnalysisWinratesAs = BLACK
analysisPVLen = 15

# Requests normally override this value. It remains a safe fallback.
maxVisits = 1000

# One interactive position at a time. These values favor laptop stability and
# work with CUDA, TensorRT, OpenCL, Eigen and ONNX builds.
numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 8
nnMaxBatchSize = 8
nnCacheSizePowerOfTwo = 18
nnMutexPoolSizePowerOfTwo = 16
nnRandomize = true

conservativePass = true
preventCleanupPhase = true
