# ──────────────────────────────────────────────────────────────────────────────
# KataGo HandTalk — configuration
#
# Precedence for every setting: environment variable > this file > built-in default.
# ──────────────────────────────────────────────────────────────────────────────

[server]
port                = 5000
default_max_visits  = 1000

[katago]
# Paths to the KataGo executable, model weights and engine config.
# Relative paths are resolved from this repository, so the outputs directory
# can be moved without editing the configuration.
katago_path = ../KataGo/katago.exe
model_path  = ../KataGo/models/kata1-tf2-b10c384-s2941M-d5872M.bin.gz
config_path = config/default_analysis.cfg
work_dir   = .runtime/katago-work

[i18n]
# Default UI language and the list of languages shipped in static/locales/.
default_language    = zh
available_languages = zh
