# ──────────────────────────────────────────────────────────────────────────────
# KataGo Web — configuration
#
# Precedence for every setting: environment variable > this file > built-in default.
# Secrets (e.g. the JWT signing key) are NOT stored here; set JWT_SECRET via an
# environment variable instead.
# ──────────────────────────────────────────────────────────────────────────────

[server]
port                = 5000
default_max_visits  = 3000
quick_max_visits    = 100

[katago]
# Paths to the KataGo executable, model weights and engine config.
# config_path may be relative to the repository root.
katago_path = C:\katago\katago.exe
model_path  = C:\katago\kata1-b18c384nbt-s9996604416-d4316597426.bin.gz
config_path = config/default_gtp.cfg

[i18n]
# Default UI language and the list of languages shipped in static/locales/.
default_language    = en
available_languages = en, zh
